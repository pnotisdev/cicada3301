[[experiment]]
id = "lag-feedback"
group = "structure"
title = "Affine lag-feedback autokey: c_i = p_i + a*c_(i-d) + b within words, d = 1..8, all a, b (6496 settings), four separator scopes, plus nonlinear maps (x^2, x^3, x^-1, 2^x, 3^x) at lag 6"
status = "excluded"
what = "The residual r = c_i - a*c_(i-d) - b must be plaintext at in-word positions >= d; scored by chi-square against uniform (invariant to any plaintext-alphabet permutation), 200-shuffle null per scope-lag"
control = "Plant (d,a,b) = (6,27,24) on the keyed solved sections: 73/73 residual positions recovered exactly, chi2 164.16 (chi2/n 2.25) against null max 67.7; wrong settings silent; solved keyed sections null-like on the same sweep"
result = "LP2 best chi2 275.17 at (d,a) = (1,1) - the doublet deficit itself (the r = 0 cell holds 63 within-word equal pairs against 346.9 expected, z -15.5, 84% of the chi2; it also crosses word boundaries, 23 vs 99.6, so it is a global digram property, not an autokey); the echo setting (6,27,24) scores 64.86 below its null max 67.74 (p99 65.36) and its whole excess is the residual cell r = 0 (F); clause / line / all scopes best 36.8-49.1 vs null max 60.2-65.5; nonlinear best 36.2 vs 67.6; word heads, initials and finals are uniform"
gap = "The echo itself remains a sparse word-internal rewrite (rate 0.0272 +/- 0.0047); no (d,a,b) makes the residual plaintext"
log = ["work/log/phase11_review.md"]
files = ["work/tmp/lag_feedback_scope_extension.txt", "work/tmp/lag_feedback_plant.txt", "work/tmp/lag_feedback_nonlinear.txt", "work/tmp/lag_feedback_head_probe.txt", "work/tmp/lag_feedback_null_shuffles.txt", "work/tmp/lag_feedback_an_end.txt"]

[[experiment]]
id = "echo-mechanisms"
group = "structure"
title = "Named lag-6 echo source mechanisms: plaintext-F replacement, collision twist W3(a), autokey chain"
status = "excluded"
what = "Mechanisms for the within-word lag-6 relation c' = 24 - 2c (80/1290 hits, +35.1 excess): the solved pages' literal-F convention in disguise; T applied to the previous rune at a would-be doublet (W3(a)); an affine autokey chain (see lag-feedback)"
control = "F-replacement: DISFAVOURED, not excluded - the 0.0056 rate (n = 1,013,590) was measured on Latin-letter positions, not GP-rune positions, and the solved text's F at eligible positions is 3/73 = 0.041, so the > 4 sd gap does not hold on the rune alphabet. W3(a): predicts c_(i-1) = c_(i-6) at every echo site, observed 3/80 vs null 2.8/80"
result = "All three named mechanisms excluded; the echo rate equals the avoided-collision rate (0.0272 +/- 0.0047 vs 0.0269-0.0282) but the corrected section correlations use eight contributing sections: deficit +0.328993, fixed-q -0.328993 (the definitions force opposite signs; uncertainty unknown); the earlier -0.38, n=9 report was defective. The coincidence stays an open observation. 2026-10-18: a null rune inserted at word ends is also excluded for the echo (echo targets word-final 32/80 vs 34.7 expected, z -0.6; lag-5 37/104 vs 40.3)"
gap = "A sparse word-internal rewrite (the echo-two-tap family) remains untestable as before"
log = ["work/log/phase11_review.md", "work/log/phase12_review2.md"]
files = ["work/tmp/w3_sharp_test.txt", "work/tmp/echo_vs_skip_rate.txt", "work/tmp/frate_pos6.txt", "work/tmp/lag6_residual_quick.py", "work/tmp/echo_pairs_report.md", "work/tmp/echo_word_final.txt"]

