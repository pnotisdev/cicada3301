[[experiment]]
id = "m04-baseline"
group = "structure"
title = "M04 hold-key repair (on a would-be repeat emit a uniform other rune, advance the plaintext, KEEP the key position) against the unchanged kscreen engine"
status = "observed"
what = "Synthetic crossed baseline, not an LP2 search: 300-rune plants (solved Cicada text and Emerson; iid keys and flat-library slices), banks of 8 streams x 16 offsets (512 cells), both signs and models, default engine options; q fitted on training plants to LP2's 86/12,947 doublet rate (0.803-0.8125)"
control = "Regression plants through the same harness: skip 40/40 and coin 40/40 detected (plaintext accuracy 0.986 / 0.987); 200 matched nulls fixed the threshold T = 1.1969 (10th largest, about 95%); held-out matched nulls 2/100 flagged; the M04 plaintext accuracy 0.154 equals the theory for a decoder right only up to the first held repair (0.160)"
result = "M04: 14/100 above T (null rate about 2/100), 0/100 reach IoC 1.40, 0/100 plaintext accuracy >= 0.95, mean accuracy 0.154: the unchanged engines lose alignment at the first held repair. Spend-key substitution (same replacement, key advanced): 100/100 detected and identified, plaintext accuracy 0.969, pointer accuracy 0.998: visible to the old screens"
gap = "One scope only (300-rune windows, 8 x 16 bank, uniform replacement runes); no stream of period <= 8 drawn (a shift-invariant stream cannot lose alignment); says nothing about whether Cicada used M04; spend versus hold is not discriminable from LP2 (reference power 0.26)"
log = ["work/log/phase15_m04_baseline.md", "work/m04/README.md"]
files = ["results/analysis/m04_baseline.txt", "results/analysis/m04_baseline.json", "results/analysis/m04_calibration.json", "results/analysis/m04_q_fit.json", "results/analysis/m04_records.jsonl"]

[[experiment]]
id = "h5-power-map"
group = "structure"
title = "Recall of the H5 flat-library sweep: independent stream + keyword plants through the real h5rs sweep path"
status = "observed"
what = "6,000 plants (L = 2..20 x skip / coin x iid or flat-library keys x solved Cicada text or Emerson; 300 runes, keyword uniform), searched over the true offset +-1, all L, both models with the campaign's engine settings; recovered = the true cell reaches IoC 1.6 (the campaign floor) or 1.8 (about its campaign-size floor)"
control = "Planter checked by a no-redraw round trip and a doublet-removal test; engine smoke test at L = 2; the result agrees with GPT's D2 gate (L = 20 plant aborts at the init, L = 13 skip plant reaches 1.807)"
result = "Recall at >= 1.6 falls from 84% (L = 2) to 7% (L = 20); at >= 1.8 from 48% to 4%; skip 58% / 36%, coin 34% / 21% (>= 1.6 / >= 1.8); no dependence on offset band or key kind. A negative sweep therefore excludes little; the 1.8 floor rejects about half of even perfectly decoded 300-rune windows (the plaintext's own IoC is about 1.8 +- 0.1)"
gap = "My plants only (uniform random keywords, no literal F, skip / coin only, window 300 because the engine truncates to 300); per-window floors other than seg0.8 are unmeasured until the queue's matched null has run"
log = ["work/log/phase16_h5_power_map.md", "work/log/phase13_gated_h5.md"]
files = ["results/analysis/h5_power_map.txt", "results/analysis/h5_power_map.json"]

[[experiment]]
id = "open-clause-windows"
group = "layout"
title = "Key restart or jump at every clause mark: library scan of clause-aligned windows (61-559 runes), likelihood score"
status = "excluded"
what = "Every screen so far fixes one key alignment per 300-rune window or restarts at a window start; the solved pages' sentences are numerically constructed (lp1-prime-sums), and 'their numbers are the direction' may mean a pointer that moves at each sentence. The 167 clause marks of LP2 give the windows; the IoC screen cannot judge windows of 60-250 runes against a library-sized null (heavy tail), the likelihood score of chanscreen v2 can (an estimate: +30 to +60 nats for 60-120 true runes against a threshold near +30)"
control = "E4 prefix plants of the same engine: 194 of 200 detected at 60 runes, 200 of 200 from 80 runes; the recomputation check reproduces 137 of 137 real library-keyed cells (null set) and rejects both false cells that occurred"
result = "0 tier-1 cells in the 82 clause windows (61-559 runes) against 1,439 streams, both signs, four channels, every offset (best S_guard 7.5 hold, 6.8 spend, 5.5 skip5, -2.0 coin; 9 cells above 5, none above 10). One false 335 nats cell (spend, sha512-ctr reject :welcome) did not reproduce and its task was re-run; five tasks that raised an error were re-run clean"
gap = "Clauses under 61 runes; a restart that is not at a clause mark; streams outside the library; q other than 0.81; plaintexts that are not English-like; a fault that hides a real hit (about 1e-5 per call)"
log = ["work/log/phase18_cicada_intent.md", "work/log/phase17_chanscreen.md", "work/log/phase19_try_all_four.md"]
files = ["results/chanscreen/summary_clause.txt", "work/chanscreen/v2/step3/PROTOCOL.md"]

