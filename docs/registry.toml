# The experiment registry: ONE row per hypothesis family or campaign, the single source behind
#   STATUS.md, results/INDEX.md, results/index.html and the status block of README.md
# (all generated by `python scripts/build_overview.py`; `--check` validates this file and the links).
#
# Rules for editing (humans and agents):
#   * Nothing in LP2 is solved. A row says what a test of this kind, in this much text, would have found
#     (control) and what was found (result). Numbers come from the logs named in `log`; not in a log, not here.
#   * status: excluded    negative, planted keys of this kind are recovered at the stated scope
#             partial     negative, but the control is recovered only in some windows / sizes (see gap)
#             untestable  no test with power at LP2's effect size exists
#             open        not run, or only partly run (cost / needs say what is left; priority 1 = first)
#             explained   puzzle furniture or community claim that is resolved, not a key
#             observed    a measured property of LP2 that any solution has to explain
#   * best / null / rule: the top screen score, the matched null's top score and the decision rule, in `unit`
#     (chart = true puts the row on the dashboard chart; only 300-rune windows are comparable there).
#   * After a new result: add or update the row, then `python scripts/build_overview.py`.

[meta]
updated = "2026-10-20"
rule = 1.40
planted_low = 1.6
planted_high = 2.06
null_max = 1.37
survivors = 0   # candidates that passed whole-section verification with controls (docs/CAMPAIGNS.md)

[[group]]
id = "streams"
title = "Additive key from a known stream (c = p + m*k, skip / coin anti-repeat)"

[[group]]
id = "generators"
title = "Seeded generators, passphrases and sequences as keys"

[[group]]
id = "structure"
title = "Cipher structure beyond c = p + k"

[[group]]
id = "layout"
title = "Restarts, reuse and layout"

[[group]]
id = "claims"
title = "Cribs, puzzle furniture and outside claims"

[[group]]
id = "observed"
title = "What LP2 shows (any solution has to explain it)"

