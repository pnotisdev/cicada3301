result = "Full-book selected-family flag p_MC=.001 floor, mix_I5_T6_w=1/4. Subsequent FIXED raw T6 halves: A +3.198569 nats/p=.004, B +8.803375/p=.001; both-positive criterion met, two-rule adjusted conjunction p=.008. I5 A +3.394918/p=.003, B -.224223/p=.016: fails positive-score requirement in B, not an exclusion of lag5 echoes. Section diagnostic completed in eight blocks after prior preserved timeout: own-rate expected 79.298359 vs observed 80, upper-tail shape p=.990 and fit p=.995; unusually small residuals, not model validation. Subsequent three-scale lower-dispersion site test (section/100 eligible/gaps), B=999: raw p=.024/.030/.687; Bonferroni .072/.090/1.000, omnibus .072, no flag. Conditional Bernoulli site null, not exact forward cipher. Pure-null selected-lag6-affine optimism +26.54 counts does not correct 80 (zero fixed-T6/tail matches). Retrospective checks, NOT untouched replication. Discriminator held"
gap = "No independent replication or correction for historical discovery-selection, actual-site spend/hold power, causal collision identification, joint lag5/lag6/S/flat-lag fit or decryption. Fixed-rule halves are retrospective; section bootstrap is plug-in for a selected family with unknown heterogeneity-sized power, not an exclusion or proof of homogeneity. Source-S gross predictable capacity 2.067 is not a realized-hit ceiling or controlled exclusion; smallest successful second mechanism unknown. Dispersion nonflag does not exclude partial regularity: 35-hidden-repair power, q_s uncertainty and forward-cipher hit dependence remain unknown"
