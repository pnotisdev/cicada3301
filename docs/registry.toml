control = "M0 (uniform repair) and M7 (wrong map) reproduce the doublets and no echo; the measurement script reproduces LP2's logged numbers (lag 6 in-word 80 / 44.5, z +5.32)"
result = "No mechanism reproduces every anomaly: no Level 2 lead. A shared repair budget (M2, a = 0.8-1.0) reproduces the doublet deficit, the lag-6 relation (0.0203-0.0257 vs LP2 0.0275 per pair) and the lag-5 echo (0.0106-0.0138 vs 0.0144) with zero excess across word gaps and flat unigrams / bigrams. None reproduces the S carrier of the lag-5 echo (S5 2-3 vs 11) or the word-length histogram (insertion at repairs moves G by < 8). Prediction 'lag-6 hits are independent': LP2 6 multi-hit words, 3 consecutive (M1 plants 4.2 +- 2.2, 2.4 +- 1.7): met, but not discriminating. Follow-ups (sections 7-8): the S carrier is calibrated at P < 0.002 over 29 sources x lags 2-8 (S 11 hits vs 2.3); English plaintext has S..S at lag 5 at 0.13 per S pair (-SELVES, SENSES), as LP2 (0.149), but no simulated cipher keeps the coincidence on cipher S (a period-5 key in 60% of words gives the overall lag-5 excess with S,S 3.2; a literal-S rule contradicts the flat S count). Word lengths: no plaintext spelling or language fits (letter-spelled English G 63-233 by text, Latin / German / Romance 253-1609; best one-parameter segmentation p 1e-4); Old English not tested"
