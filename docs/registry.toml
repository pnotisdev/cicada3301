group = "structure"
title = "A book as the running key ('OTP-class' from a referenced text): any natural-language text, any letter -> rune table, keyless"
status = "partial"
what = "LP2's IoC over 12,956 runes (0.99987) against c = p + m*k with k the letters of 16 Gutenberg texts in six languages plus Emerson, digraph or letter spelling, Emerson plaintext; GP table, 20,000 random tables per book, and a table searched to flatten the key; lag-2..8 pair chi-square with a pair-flattened table"
control = "Real encryptions with the skip rule (q = 0.81) at LP2's length: GP table, multipliers 1 / 28 / 3 / 17, 680 plants, lowest per text +31.7 to +77.2 null sd; null: uniform key + skip, IoC 0.99986 +- 0.00051 (max 1.00181)"
result = "GP or any untuned table: excluded (random tables: 0.01% quantile +11.3 to +21.9 sd; LP2 +0.02). Table tuned to flatten the unigrams: predicted +1.9 to +6.3 sd, 40 plants at the flattest table 1.00091 +- 0.00076 with 6 of 40 above the null max, per section +0.1 to +0.6 sd; pair statistic +1.3 to +2.2 sd on average: NOT excluded"
gap = "A table chosen to flatten the key against the plaintext's frequencies (needs a table-invariant, drift-tracking decoder: group the ciphertext by key letter); keys computed from a book (sums, hashes, book-code numbers as numbers); art / image bytes; plaintexts that are not English-like; languages outside the six measured"
log = ["work/log/phase22_book_keys.md"]
files = ["work/book_key_flatness.py", "work/book_key_pairs.py", "work/tmp/book_key_random_tables.py", "results/analysis/book_key_flatness.txt", "results/analysis/book_key_random_tables.txt", "results/analysis/book_key_pairs.txt"]

[[experiment]]
id = "book-key-decoder"
group = "structure"
title = "A cited book as the running key under ANY letter->rune table: table-invariant, drift-tracking decoder (gate passed, LP2 not run)"
status = "open"
priority = 3
what = "c = p + pi(k_j), k a candidate book (digraph or letter spelling), pi unknown, skip rule q = 0.81. Table-free beam over the key pointer (ciphertext grouped by key letter, each group's shift integrated out; 64 states, 8 per pointer, offsets in steps of 8), then hard EM with an exact skip-rule Viterbi for decryption"
control = "Plants with a flattening table per plant (phase 22's search), skip rule, grid offset 0-7 below the truth; power at the family threshold (p = 5e-10, exponential tail fit): 300 runes 21/40 and 27/40 (digraph / letters), 729 runes 24/30 and 28/30, 1,524 runes 19/20 and 17/20, 3,316 runes 12/12 and 12/12; 612 nulls (wrong offset, wrong book, uniform key), 0 above the threshold"
result = "Gate only: no LP2 window has been decoded"
cost = "About 0.033 ms per rune per book-offset: the frozen screen (729-rune windows at the 8 section starts, both spellings) is about 310 core-hours for the KJV, about 480 for the six cited books"
needs = "The user's go-ahead. All six books are local (Liber AL, Agrippa, the Mabinogion, Blake in the git-ignored work/ref/corpora/cited/, URLs and SHA-256 in the log); the Agrippa copy is a raw 1651 OCR, so a negative there is weak"
gap = "Not covered even after a run: non-English plaintexts, editions with letters our copy has and theirs lacks (no backward step), literal-F / coin / q other than 0.81, keys computed from the book"
log = ["work/log/phase23_book_key_decoder.md"]
files = ["work/book_key_decoder.py", "results/analysis/book_key_decoder.txt", "work/tmp/bkd_diag.py", "work/tmp/bkd_diag2.py", "work/tmp/bkd_diag3.py", "work/tmp/bkd_diag4.py", "work/tmp/bkd_diag5.py"]

